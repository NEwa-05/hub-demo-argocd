### observability
---    
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
spec:
  project: default
  source:
    path: tools/overlays/observability
    repoURL: https://github.com/NEwa-05/hub-demo-argocd.git
    targetRevision: localdemo
  destination:
    server: 'https://kubernetes.default.svc.cluster.local'
  syncPolicy:
    syncOptions:
      - PruneLast=true
